    <!-- Estilos mínimos para mostrar algo mientras carga React -->
    <style>
      body { 
        margin: 0; 
        font-family: 'Poppins', 'Inter', sans-serif;
        background: #0a0a0a;
        color: #f8fafc;
      }
      .loading-indicator {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        flex-direction: column;
        gap: 1.25rem;
      }
      .loading-brand-wrap {
        position: relative;
        width: min(200px, 48vw);
        aspect-ratio: 1080 / 1350;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .loading-brand-wrap img {
        width: 100%;
        height: auto;
        object-fit: contain;
        animation: brandPulse 1.4s ease-in-out infinite;
        filter: drop-shadow(0 0 20px rgba(0, 229, 209, 0.4)) drop-shadow(0 0 32px rgba(106, 48, 180, 0.35));
      }
      @keyframes brandPulse {
        0%, 100% { transform: scale(0.96); opacity: 0.92; }
        50% { transform: scale(1); opacity: 1; }
      }
      .loading-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(0, 229, 209, 0.25);
        border-radius: 50%;
        border-top-color: #00e5d1;
        animation: spin 0.85s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .loading-indicator p {
        margin: 0;
        font-size: 0.875rem;
        color: rgba(248, 250, 252, 0.65);
      }
    </style>
    
    <title>ALENIA | Automatización de máquinas con hardware, software e IA</title>

  <body>
    <!-- Contenido de carga inicial mientras React inicializa -->
    <div id="root">
      <div class="loading-indicator">
        <div class="loading-brand-wrap" aria-hidden="true">
          <img src="/images/logos-alenia/3.png" alt="" width="108" height="135" decoding="async" />
        </div>
        <div class="loading-spinner" role="status" aria-label="Cargando"></div>
        <p>Cargando experiencia interactiva...</p>
      </div>
    </div>
