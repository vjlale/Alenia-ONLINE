    <!-- Service Worker Registration (solo en producción) -->
  <script type="module">
    // Evitar que el SW interfiera con el servidor de desarrollo (Vite @ localhost:5173)
    if ('serviceWorker' in navigator) {
      if (import.meta.env && import.meta.env.PROD) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(registration => {
              console.log('SW registered (prod):', registration);
            })
            .catch(err => {
              console.log('SW registration failed:', err);
            });
        });
      } else {
        // En desarrollo, desregistrar cualquier SW previo para evitar cachés corruptas/módulos duplicados
        navigator.serviceWorker.getRegistrations().then(regs => {
          for (const reg of regs) {
            reg.unregister().then(() => console.log('SW unregistered (dev)'));
          }
        });
        // Limpieza básica de caches del SW previo (opcional, silenciosa)
        if (window.caches && caches.keys) {
          caches.keys().then(keys => keys.forEach(k => caches.delete(k)));
        }
      }
    }
  </script>
