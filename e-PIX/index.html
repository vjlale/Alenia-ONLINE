<html lang="es">
  <head>

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#f000b8" />
    <meta name="msapplication-navbutton-color" content="#f000b8" />
    <!-- Opera supports msapplication-navbutton-color; Firefox does not support theme-color meta tag -->
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#f000b8" />
    <meta name="msapplication-TileColor" content="#f000b8" />
    <meta name="msapplication-navbutton-color" content="#f000b8" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PicShop" />
    
    <!-- Open Graph -->
    <meta property="og:title" content="PicShop AI Studio" />
    <meta property="og:description" content="Editor de imágenes con IA para catálogos de e-commerce" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://picshop-1071804760043.us-central1.run.app" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:description" content="Editor de imágenes con IA para e-commerce" />
    
    <!-- Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" href="/images/logo1.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/images/logo1.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/images/logo1.png" />
    
    <title>PicShop AI Studio</title>
</head>
  <body class="bg-cyber-dark text-cyber-text">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  
    <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
            .then(registration => {
              console.log('SW registered: ', registration);
            })
            .catch(registrationError => {
              console.log('SW registration failed: ', registrationError);
          });
      });
    }
  </script>
</body>
</html>
