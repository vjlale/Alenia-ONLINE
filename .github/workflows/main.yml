# GitHub Pages: solo manual. La web en Hostinger se actualiza con push a main
# vía el workflow "Deploy to Hostinger (FTP)".

name: GitHub Pages (manual — no Hostinger)

on:
  workflow_dispatch:

jobs:
  build-and-deploy-github-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
