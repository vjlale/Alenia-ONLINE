# Publica en GitHub Pages (URL tipo *.github.io). NO actualiza el hosting Hostinger.
# Para alenia.online / producción Hostinger usá el workflow "Deploy to Hostinger (FTP)".

name: GitHub Pages (no actualiza Hostinger)

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy-github-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Aviso — producción Hostinger es otro workflow
        run: |
          echo "::notice title=GitHub Pages::Este job solo publica en GitHub Pages. Para actualizar tu web en Hostinger, el workflow debe ser 'Deploy to Hostinger (FTP)' (pestaña Actions)."

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
