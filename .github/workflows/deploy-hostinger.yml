# Despliegue automático a Hostinger al hacer push a la rama principal.
#
# Secretos en GitHub (Settings → Secrets and variables → Actions → New repository secret):
#   HOSTINGER_FTP_HOST      → Servidor FTP (ej. ftp.tudominio.com o la IP que muestra hPanel)
#   HOSTINGER_FTP_USERNAME  → Usuario FTP
#   HOSTINGER_FTP_PASSWORD  → Contraseña FTP
#
# Opcionales:
#   HOSTINGER_FTP_REMOTE_DIR → Carpeta remota (ej. public_html/ o ./). Si no creás el secreto, se usa ./
#
# Dónde sacar los datos: hPanel → Archivos → Cuentas FTP (o Detalles FTP del dominio).
# FTPS en puerto 21 es lo habitual en Hostinger. Si falla el deploy, probá protocol: ftp en el paso Deploy.
#
# Este workflow NO sustituye al de GitHub Pages (main.yml). Si solo usás Hostinger, podés desactivar
# el job de Pages o borrar ese workflow.

name: Deploy to Hostinger (FTP)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: hostinger-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy-ftp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (Vite + post-build Hostinger)
        run: npm run build:hostinger

      - name: Deploy dist to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.HOSTINGER_FTP_HOST }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: ${{ secrets.HOSTINGER_FTP_REMOTE_DIR != '' && secrets.HOSTINGER_FTP_REMOTE_DIR || './' }}
          state-name: .ftp-deploy-sync-state.json
          # dangerous-clean-slate: true  # Descomentá solo si querés borrar en el servidor lo que no esté en dist (riesgoso)
