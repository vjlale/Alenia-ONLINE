# Despliegue automático a Hostinger al hacer push a la rama principal.
#
# Secretos en GitHub (Settings → Secrets and variables → Actions → New repository secret):
#   HOSTINGER_FTP_HOST      → SOLO hostname o IP (ej. ftp.tudominio.com). Sin ftp:// ni barras.
#   HOSTINGER_FTP_USERNAME  → Usuario FTP
#   HOSTINGER_FTP_PASSWORD  → Contraseña FTP
#
# Opcionales:
#   HOSTINGER_FTP_REMOTE_DIR → Carpeta remota (ej. public_html/). Sin el secreto se usa ./
#
# Si ves ENOTFOUND: el host no existe en DNS. En hPanel copiá el "FTP host" exacto; suele ser
# ftp.tudominio.com o una IP, NO la URL web (https://...).
#
# Este workflow NO sustituye al de GitHub Pages (main.yml).

name: Deploy to Hostinger (FTP)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: hostinger-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy-ftp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (Vite + post-build Hostinger)
        run: npm run build:hostinger

      # Evita ENOTFOUND por espacios, saltos de línea o prefijo ftp:// en el secreto
      - name: Normalizar host FTP y comprobar DNS
        id: ftp
        env:
          RAW_HOST: ${{ secrets.HOSTINGER_FTP_HOST }}
          RAW_DIR: ${{ secrets.HOSTINGER_FTP_REMOTE_DIR }}
        run: |
          set -e
          trim() { printf '%s' "$1" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'; }
          H=$(trim "$RAW_HOST")
          H=$(printf '%s' "$H" | sed 's|^ftp://||I' | sed 's|^ftps://||I' | sed 's|/.*$||')
          if [ -z "$H" ]; then
            echo "::error::HOSTINGER_FTP_HOST está vacío. Creá el secreto con el servidor FTP de hPanel."
            exit 1
          fi
          echo "Comprobando resolución DNS para: $H"
          if ! getent hosts "$H" >/dev/null 2>&1; then
            echo "::error::No se resuelve el host FTP '$H'. Revisá el secreto HOSTINGER_FTP_HOST: debe ser solo el nombre (ej. ftp.alenia.online) o la IP que muestra Hostinger, sin https:// ni rutas."
            exit 1
          fi
          D=$(trim "$RAW_DIR")
          if [ -z "$D" ]; then D="./"; fi
          echo "host=$H" >> "$GITHUB_OUTPUT"
          echo "remote_dir=$D" >> "$GITHUB_OUTPUT"

      - name: Deploy dist to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ steps.ftp.outputs.host }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: ${{ steps.ftp.outputs.remote_dir }}
          state-name: .ftp-deploy-sync-state.json
          # dangerous-clean-slate: true
